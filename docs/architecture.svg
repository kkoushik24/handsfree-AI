<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 860" width="1240" height="860" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e1a"/>
      <stop offset="1" stop-color="#101a2e"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#aab6cc"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#6ea8ff"/>
    </marker>
    <marker id="arrOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#f5a623"/>
    </marker>
  </defs>

  <rect width="1240" height="860" rx="24" fill="url(#bg)"/>

  <!-- Title -->
  <text x="620" y="54" text-anchor="middle" font-size="29" font-weight="700" fill="#ffffff">HandsFree AI — System Architecture</text>
  <text x="620" y="82" text-anchor="middle" font-size="14" fill="#8fa0bf">Local-first · human-in-the-loop · accessibility-driven Android agent</text>

  <!-- USER -->
  <rect x="40" y="145" width="160" height="120" rx="14" fill="#1b1f38" stroke="#8b7cf6" stroke-width="2"/>
  <circle cx="120" cy="177" r="10" fill="#8b7cf6"/>
  <path d="M102 207 q18 -26 36 0 z" fill="#8b7cf6"/>
  <text x="120" y="232" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">User</text>
  <text x="120" y="251" text-anchor="middle" font-size="11.5" fill="#b9b2f5">speak · type · approve</text>

  <!-- SAFETY -->
  <rect x="40" y="300" width="160" height="225" rx="14" fill="#10241a" stroke="#3ddc84" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="120" y="330" text-anchor="middle" font-size="14" font-weight="700" fill="#7ee2a8">Safety layers</text>
  <g font-size="12" fill="#cdeedb">
    <text x="56" y="362">✓ Approve every action</text>
    <text x="56" y="392">✓ Visible Stop button</text>
    <text x="56" y="422">✓ Sensitive fields blocked</text>
    <text x="56" y="452">✓ Stale-action check</text>
    <text x="56" y="482">✓ Hallucination guard</text>
    <text x="56" y="508">✓ Graceful failure</text>
  </g>

  <!-- ANDROID PHONE ZONE -->
  <rect x="250" y="110" width="430" height="520" rx="20" fill="#0d1c16" stroke="#3ddc84" stroke-width="2"/>
  <text x="272" y="138" font-size="13" font-weight="700" fill="#3ddc84" letter-spacing="2">ANDROID PHONE · KOTLIN + COMPOSE</text>

  <rect x="280" y="160" width="175" height="90" rx="12" fill="#143024" stroke="#2f9a63" stroke-width="1.5"/>
  <text x="367" y="192" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Voice I/O</text>
  <text x="367" y="214" text-anchor="middle" font-size="12" fill="#a9d4bc">SpeechRecognizer</text>
  <text x="367" y="232" text-anchor="middle" font-size="12" fill="#a9d4bc">TextToSpeech</text>

  <rect x="475" y="160" width="175" height="90" rx="12" fill="#143024" stroke="#2f9a63" stroke-width="1.5"/>
  <text x="562" y="192" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Compose UI</text>
  <text x="562" y="214" text-anchor="middle" font-size="12" fill="#a9d4bc">chat · action card</text>
  <text x="562" y="232" text-anchor="middle" font-size="12" fill="#a9d4bc">Approve · Decline · Stop</text>

  <rect x="280" y="285" width="370" height="90" rx="12" fill="#143024" stroke="#2f9a63" stroke-width="1.5"/>
  <text x="465" y="317" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Task Controller (agent)</text>
  <text x="465" y="341" text-anchor="middle" font-size="12" fill="#a9d4bc">plan loop · stale-action check · cancel</text>
  <text x="465" y="359" text-anchor="middle" font-size="12" fill="#a9d4bc">talks to the backend over HTTP</text>

  <rect x="280" y="410" width="370" height="90" rx="12" fill="#143024" stroke="#2f9a63" stroke-width="1.5"/>
  <text x="465" y="442" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">AccessibilityService</text>
  <text x="465" y="466" text-anchor="middle" font-size="12" fill="#a9d4bc">reads on-screen controls · performs tap / type / scroll</text>
  <text x="465" y="484" text-anchor="middle" font-size="12" fill="#a9d4bc">never touches password, OTP or payment fields</text>

  <rect x="280" y="535" width="370" height="70" rx="12" fill="#101f19" stroke="#2f9a63" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="465" y="565" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Installed apps</text>
  <text x="465" y="587" text-anchor="middle" font-size="12" fill="#a9d4bc">Settings · WhatsApp · Maps · any app</text>

  <!-- phone internal arrows -->
  <line x1="367" y1="250" x2="367" y2="285" stroke="#aab6cc" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="562" y1="250" x2="562" y2="285" stroke="#aab6cc" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <line x1="465" y1="375" x2="465" y2="410" stroke="#aab6cc" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <line x1="465" y1="500" x2="465" y2="535" stroke="#aab6cc" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>

  <!-- user arrow -->
  <line x1="200" y1="205" x2="280" y2="205" stroke="#aab6cc" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>

  <!-- LAPTOP ZONE -->
  <rect x="820" y="110" width="380" height="415" rx="20" fill="#0d1626" stroke="#4f8ef7" stroke-width="2"/>
  <text x="842" y="138" font-size="13" font-weight="700" fill="#6ea8ff" letter-spacing="2">LAPTOP · LOCAL-FIRST BACKEND</text>

  <rect x="845" y="160" width="330" height="90" rx="12" fill="#13223d" stroke="#3b6fd1" stroke-width="1.5"/>
  <text x="1010" y="190" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">FastAPI Server</text>
  <text x="1010" y="212" text-anchor="middle" font-size="12" fill="#a9c4f0">POST /plan · GET /health · POST /speak</text>
  <text x="1010" y="232" text-anchor="middle" font-size="12" fill="#a9c4f0">typed request / response contract (Pydantic)</text>

  <rect x="845" y="275" width="330" height="100" rx="12" fill="#2b1e10" stroke="#f5a623" stroke-width="1.5"/>
  <text x="1010" y="304" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Validation + Safety Guard</text>
  <text x="1010" y="326" text-anchor="middle" font-size="12" fill="#ffd9a0">output must match the action schema</text>
  <text x="1010" y="344" text-anchor="middle" font-size="12" fill="#ffd9a0">target id must exist on screen · retry once</text>
  <text x="1010" y="362" text-anchor="middle" font-size="12" fill="#ffd9a0">sensitive field → hand back to the user</text>

  <rect x="845" y="405" width="330" height="100" rx="12" fill="#231537" stroke="#a06cf0" stroke-width="1.5"/>
  <text x="1010" y="436" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Gemma (E2B) via Ollama</text>
  <text x="1010" y="459" text-anchor="middle" font-size="12" fill="#d3b9f8">schema-constrained JSON output</text>
  <text x="1010" y="478" text-anchor="middle" font-size="12" fill="#d3b9f8">temperature 0 · runs 100% locally</text>

  <!-- laptop internal arrows -->
  <line x1="1010" y1="250" x2="1010" y2="275" stroke="#aab6cc" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="1010" y1="375" x2="1010" y2="405" stroke="#aab6cc" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>

  <!-- request path: phone -> backend -->
  <path d="M650 315 H750 V190 H845" fill="none" stroke="#6ea8ff" stroke-width="2.4" marker-end="url(#arrBlue)"/>
  <text x="656" y="307" font-size="11" fill="#9cc2ff">POST /plan</text>
  <!-- response path: backend -> phone -->
  <path d="M845 225 H790 V345 H650" fill="none" stroke="#f5a623" stroke-width="2.4" marker-end="url(#arrOrange)"/>
  <text x="656" y="362" font-size="11" fill="#ffc766">one action</text>

  <!-- CLOUD ZONE -->
  <rect x="820" y="565" width="380" height="125" rx="20" fill="none" stroke="#8a94a8" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="842" y="590" font-size="12" font-weight="700" fill="#aab4c8" letter-spacing="2">CLOUD · OPTIONAL</text>
  <rect x="845" y="602" width="330" height="70" rx="12" fill="#1b2030" stroke="#6b7487" stroke-width="1.5"/>
  <text x="1010" y="630" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">ElevenLabs Text-to-Speech</text>
  <text x="1010" y="652" text-anchor="middle" font-size="11" fill="#b4bdd0">key stays on the laptop · offline fallback: Android TTS</text>
  <line x1="1010" y1="525" x2="1010" y2="602" stroke="#aab6cc" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arr)"/>

  <!-- BADGES -->
  <g font-size="12" font-weight="700" text-anchor="middle" fill="#1a1400">
    <circle cx="240" cy="205" r="11" fill="#f5c542"/><text x="240" y="209.5">1</text>
    <circle cx="465" cy="392" r="11" fill="#f5c542"/><text x="465" y="396.5">2</text>
    <circle cx="750" cy="252" r="11" fill="#f5c542"/><text x="750" y="256.5">3</text>
    <circle cx="1010" cy="390" r="11" fill="#f5c542"/><text x="1010" y="394.5">4</text>
    <circle cx="1160" cy="290" r="11" fill="#f5c542"/><text x="1160" y="294.5">5</text>
    <circle cx="790" cy="288" r="11" fill="#f5c542"/><text x="790" y="292.5">6</text>
    <circle cx="465" cy="517" r="11" fill="#f5c542"/><text x="465" y="521.5">7</text>
    <circle cx="1010" cy="546" r="11" fill="#f5c542"/><text x="1010" y="550.5">8</text>
  </g>

  <!-- LEGEND -->
  <text x="40" y="724" font-size="13" font-weight="700" fill="#8fa0bf" letter-spacing="2">THE TASK LOOP</text>
  <g font-size="13" font-weight="700" fill="#ffffff">
    <text x="70" y="758">Goal in</text>
    <text x="365" y="758">Observe</text>
    <text x="660" y="758">Ask the planner</text>
    <text x="955" y="758">Plan locally</text>
    <text x="70" y="813">Safety guard</text>
    <text x="365" y="813">Human approval</text>
    <text x="660" y="813">Act and verify</text>
    <text x="955" y="813">Speak (optional)</text>
  </g>
  <g font-size="11.5" fill="#9fb0cc">
    <text x="70" y="776">user speaks or types a goal</text>
    <text x="365" y="776">app reads the on-screen controls</text>
    <text x="660" y="776">POST /plan with goal + controls</text>
    <text x="955" y="776">Gemma returns one JSON action</text>
    <text x="70" y="831">validate · block sensitive fields</text>
    <text x="365" y="831">user approves, declines or stops</text>
    <text x="660" y="831">execute, re-observe, repeat</text>
    <text x="955" y="831">ElevenLabs voice confirmation</text>
  </g>
  <g font-size="12" font-weight="700" text-anchor="middle" fill="#1a1400">
    <circle cx="51" cy="753" r="11" fill="#f5c542"/><text x="51" y="757.5">1</text>
    <circle cx="346" cy="753" r="11" fill="#f5c542"/><text x="346" y="757.5">2</text>
    <circle cx="641" cy="753" r="11" fill="#f5c542"/><text x="641" y="757.5">3</text>
    <circle cx="936" cy="753" r="11" fill="#f5c542"/><text x="936" y="757.5">4</text>
    <circle cx="51" cy="808" r="11" fill="#f5c542"/><text x="51" y="812.5">5</text>
    <circle cx="346" cy="808" r="11" fill="#f5c542"/><text x="346" y="812.5">6</text>
    <circle cx="641" cy="808" r="11" fill="#f5c542"/><text x="641" y="812.5">7</text>
    <circle cx="936" cy="808" r="11" fill="#f5c542"/><text x="936" y="812.5">8</text>
  </g>
</svg>
